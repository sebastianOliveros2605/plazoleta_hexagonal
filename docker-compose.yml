services:

  mysql_usuarios:
    image: mysql:8
    container_name: mysql_usuarios
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: usuarios
      MYSQL_DATABASE: usuarios_db
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_usuarios_data:/var/lib/mysql

  mysql_plazoleta:
    image: mysql:8
    container_name: mysql_plazoleta
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: plazoleta_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_plazoleta_data:/var/lib/mysql

  mongodb_trazabilidad:
    image: mongo:latest
    container_name: mongodb_trazabilidad
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - mongo_trazabilidad_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_notificaciones
    restart: always
    ports:
      - "5672:5672"   # Puerto de comunicación
      - "15672:15672" # Puerto de la interfaz gráfica (Panel de control)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mysql_usuarios_data:
  mysql_plazoleta_data:
  mongo_trazabilidad_data:
  rabbitmq_data:
