spring.application.name=plazoleta-service

spring.datasource.url=jdbc:mysql://localhost:3308/plazoleta_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
logging.level.feign=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework=INFO

usuarios.service.url=http://localhost:8080
trazabilidad.service.url=http://localhost:8082
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest

spring.rabbitmq.host=${rabbitmq.host}
spring.rabbitmq.port=${rabbitmq.port}
spring.rabbitmq.username=${rabbitmq.username}
spring.rabbitmq.password=${rabbitmq.password}
security.jwt.secret=proyecto_pragma_plazoleta_firma_token_seguro_2026

server.port=8081
